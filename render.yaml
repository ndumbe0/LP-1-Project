# Render blueprint — deploys via the repo Dockerfile, whose CMD already runs
# `streamlit run app.py --server.port=8501 --server.address=0.0.0.0`.
# The image/Docker runtime never runs Render's Python auto-detect, so the
# "app.py does not export a top-level app" error cannot occur — this works
# even for plain Web Services created with Environment = Docker.
services:
  - type: web
    name: lp1-startup-funding-analyzer
    runtime: image
    image:
      path: ./Dockerfile
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: GOOGLE_AI_API_KEY # set the real value in the Render dashboard
        sync: false
