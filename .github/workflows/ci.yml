name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app.py eda_cleaning.py train_models.py startup_funding tests

      - name: Test
        run: python -m pytest

      - name: Import smoke test
        run: python -m compileall app.py eda_cleaning.py train_models.py startup_funding

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off
