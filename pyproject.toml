[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".git",
  ".kilo",
  ".venv",
  "Files",
  "project-root",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "Files", "project-root"]
